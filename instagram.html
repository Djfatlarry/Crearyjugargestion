<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --purple:#8F83B9;
  --purple-dark:#52486C;
  --purple-light:#EFEDF8;
  --purple-pale:#F7F6FC;
  --peach:#F7D5C4;
  --mint:#BCE3DE;
  --mint-dark:#3D7E73;
  --yellow:#FFF0B3;
  --yellow-dark:#8C6D00;
  --coral-dark:#A8543B;
  --ink:#2A2536;
  --ink-soft:#6B6478;
  --line:#E4E0F0;
  --surface:#FFFFFF;
  --bg:#FBFAFD;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-card:0 1px 2px rgba(82,72,108,0.06), 0 4px 16px rgba(82,72,108,0.05);
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.shell{max-width:920px;margin:0 auto;padding:1.75rem 1.25rem 4rem;}

.header{background:linear-gradient(135deg, var(--purple-dark) 0%, #463D5C 100%);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:14px;margin-bottom:1.25rem;}
.header h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;color:#fff;letter-spacing:-0.01em;}
.header p{font-size:13px;color:rgba(255,255,255,0.6);margin-top:3px;font-weight:500;}
.header a{margin-left:auto;color:#fff;font-size:13px;font-weight:700;text-decoration:none;background:rgba(255,255,255,0.12);padding:8px 12px;border-radius:var(--radius-md);white-space:nowrap;}
.header a:hover{background:rgba(255,255,255,0.2);}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;box-shadow:var(--shadow-card);}
.card + .card{margin-top:1rem;}
.section-label{font-size:11.5px;color:var(--purple-dark);text-transform:uppercase;letter-spacing:0.07em;font-weight:800;margin-bottom:10px;}
.muted{font-size:13px;color:var(--ink-soft);line-height:1.5;}

label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-soft);flex:1;min-width:180px;}
input,select,textarea{font-family:'Nunito',sans-serif;font-size:14.5px;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--purple-pale);color:var(--ink);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;}
textarea{resize:vertical;min-height:150px;line-height:1.5;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}

.btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;border:none;border-radius:var(--radius-md);padding:10px 16px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
.btn:disabled{opacity:.55;cursor:default;}
.btn-primary{background:var(--purple-dark);color:#fff;}
.btn-primary:not(:disabled):hover{background:#463D5C;}
.btn-soft{background:var(--purple-light);color:var(--purple-dark);}
.btn-soft:not(:disabled):hover{background:#E4E0F4;}
.btn-good{background:var(--mint-dark);color:#fff;}
.btn-danger{background:none;color:var(--coral-dark);padding-left:8px;padding-right:8px;}
.btn-danger:hover{text-decoration:underline;}

details.config summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--purple-dark);list-style:none;display:flex;align-items:center;gap:6px;}
details.config summary::-webkit-details-marker{display:none;}
details.config summary::before{content:'▸';transition:transform .15s;}
details.config[open] summary::before{transform:rotate(90deg);}
details.config .row{margin-top:12px;}
.estado-conexion{font-size:12px;color:var(--ink-soft);margin-left:auto;font-weight:600;}

.tabs{display:flex;gap:4px;background:var(--purple-light);border-radius:var(--radius-lg);padding:5px;margin:1.25rem 0 1rem;}
.tab{flex:1;padding:10px 6px;font-size:13.5px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--purple-dark);border-radius:var(--radius-md);font-family:'Nunito',sans-serif;}
.tab.active{background:var(--purple-dark);color:#fff;box-shadow:0 2px 8px rgba(82,72,108,0.25);}
.tab .count{font-size:12px;opacity:.7;margin-left:4px;}

.borrador-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.borrador-head h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--purple-dark);}
.borrador-head .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.pill{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pill.borrador{background:var(--yellow);color:var(--yellow-dark);}
.pill.aprobado{background:var(--mint);color:var(--mint-dark);}
.pill.publicado{background:var(--purple-light);color:var(--purple-dark);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip{font-size:12px;font-weight:700;background:var(--purple-pale);border:1px solid var(--line);color:var(--purple-dark);padding:3px 9px;border-radius:999px;}
.head-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -4px 12px;padding-left:4px;}
.slides a{flex:0 0 auto;scroll-snap-align:start;}
.slides img{width:200px;height:250px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--line);display:block;background:var(--purple-pale);}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.error-box{background:#FBEAE5;color:var(--coral-dark);font-size:13px;font-weight:600;padding:10px 12px;border-radius:var(--radius-md);margin-top:10px;}
.vacio{text-align:center;padding:2.5rem 1rem;}

.chat{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;}
.chat-hist{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:260px;overflow-y:auto;}
.msg{font-size:13.5px;line-height:1.45;padding:9px 12px;border-radius:14px;max-width:85%;}
.msg.yo{align-self:flex-end;background:var(--purple-dark);color:#fff;border-bottom-right-radius:4px;}
.msg.ia{align-self:flex-start;background:var(--purple-light);color:var(--ink);border-bottom-left-radius:4px;}
.chat-form{display:flex;gap:8px;}
.chat-form input{flex:1;}
.plantillas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.plantillas:empty{display:none;}
.plantillas .chip button{background:none;border:none;color:var(--coral-dark);font-weight:800;cursor:pointer;margin-left:4px;font-size:13px;}
.chat-form textarea{flex:1;min-height:46px;height:46px;resize:vertical;}
.chat-extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.chat-extra .btn{font-size:13px;padding:7px 12px;}
.trabajando{font-size:12.5px;color:var(--ink-soft);margin-top:6px;display:none;align-items:center;gap:8px;}
.card.procesando .trabajando{display:flex;}
.chat-ejemplos{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.card.procesando .slides{opacity:.45;transition:opacity .2s;}
.spinner.oscuro{border-color:rgba(82,72,108,.25);border-top-color:var(--purple-dark);}
.fecha-pub{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--purple-dark);}
.fecha-pub select{width:auto;padding:7px 10px;font-size:13.5px;}
.manual{margin-top:14px;background:var(--purple-pale);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;}
.manual.hoy{background:#FFF6D6;border-color:#F5D76E;}
.manual-tit{font-weight:800;color:var(--purple-dark);font-size:14px;}
.manual .acciones{margin-top:8px;}
.cal-dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-top:10px;box-shadow:var(--shadow-card);}
.cal-fecha{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--purple-dark);margin-bottom:6px;}
.cal-fecha::first-letter{text-transform:uppercase;}
.cal-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
.cal-item:first-of-type{border-top:none;}
.cal-hora{font-weight:800;color:var(--purple-dark);width:52px;flex-shrink:0;}
.cal-item img{width:44px;height:55px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.cal-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;}
.cal-item .btn{font-size:13px;padding:7px 12px;}
.editor-agenda{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.dia-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap;}
.dia-row input[type=time],.dia-row select{width:auto;padding:6px 8px;}
.dia-row input[type=checkbox]{width:auto;}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:12px 18px;border-radius:var(--radius-md);opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:10;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:560px){
  .shell{padding:1rem 1rem 3rem;}
  .header{padding:1rem 1.1rem;}
  .header h1{font-size:20px;}
  .card{padding:1.1rem;}
  .slides img{width:160px;height:200px;}
}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div>
      <h1>Instagram</h1>
      <p>Borradores del agente: revisá, ajustá el texto y aprobá</p>
    </div>
    <a href="index.html">← Volver a la app</a>
  </div>

  <div class="card">
    <details class="config" id="config">
      <summary>Conexión <span class="estado-conexion" id="estado-conexion"></span></summary>
      <div class="row">
        <label class="field">URL del backend
          <input type="text" id="cfg-url" placeholder="https://tu-backend.onrender.com">
        </label>
        <label class="field">Clave de admin (IG_ADMIN_KEY)
          <input type="password" id="cfg-clave" placeholder="la que cargaste en Render">
        </label>
        <button class="btn btn-soft" onclick="guardarConfig()">Guardar</button>
      </div>
    </details>
  </div>

  <div class="card">
    <div class="section-label">Nueva publicación</div>
    <div class="row">
      <label class="field">Producto
        <select id="gen-producto"><option value="">Automático (el que hace más que no aparece)</option></select>
      </label>
      <label class="field" style="flex:0 0 200px;min-width:170px;">Estilo
        <select id="gen-tema">
          <optgroup label="Diseños base">
            <option value="panel">Panel</option>
            <option value="color">Color</option>
            <option value="crema">Crema</option>
          </optgroup>
          <optgroup label="Mis plantillas" id="gen-plantillas"></optgroup>
        </select>
      </label>
      <button class="btn btn-primary" id="btn-generar" onclick="generar()">Generar</button>
    </div>
    <p class="muted" style="margin-top:8px;">Tarda unos 30 segundos: escribe los textos, arma las imágenes y las guarda como borrador. Después la podés ajustar charlando con Claude.</p>
    <div id="mis-plantillas" class="plantillas"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-estado="calendario" onclick="cambiarTab(this)">Calendario</button>
    <button class="tab active" data-estado="borrador" onclick="cambiarTab(this)">Borradores<span class="count"></span></button>
    <button class="tab" data-estado="aprobado" onclick="cambiarTab(this)">Aprobados<span class="count"></span></button>
    <button class="tab" data-estado="publicado" onclick="cambiarTab(this)">Publicados<span class="count"></span></button>
  </div>

  <div id="lista"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// Comparte la URL del backend con la app (misma clave de localStorage)
const BACKEND_KEY = 'cyj_backend_url_v1';
const CLAVE_KEY = 'cyj_ig_admin_key_v1';

function leer(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } }
function escribir(k, v){ try { localStorage.setItem(k, v); } catch {} }

let borradores = [];
let estadoActual = 'borrador';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}

async function api(metodo, ruta, body){
  const base = leer(BACKEND_KEY).replace(/\/$/, '');
  if(!base) throw new Error('Configurá la URL del backend en "Conexión"');
  const headers = { 'Content-Type': 'application/json' };
  const clave = leer(CLAVE_KEY);
  if(clave) headers['x-admin-key'] = clave;
  const res = await fetch(base + ruta, { method: metodo, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.ok === false) throw new Error(data.error || ('Error ' + res.status));
  return data;
}

function guardarConfig(){
  escribir(BACKEND_KEY, document.getElementById('cfg-url').value.trim().replace(/\/$/, ''));
  escribir(CLAVE_KEY, document.getElementById('cfg-clave').value.trim());
  toast('Conexión guardada');
  iniciar();
}

async function cargarCandidatos(){
  const sel = document.getElementById('gen-producto');
  try{
    const { candidatos } = await api('GET', '/instagram/candidatos?n=30');
    sel.innerHTML = '<option value="">Automático (el que hace más que no aparece)</option>' +
      candidatos.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}${c.ultima_publicacion ? '' : ' · nunca publicado'}</option>`).join('');
  }catch(e){ /* el estado de conexión ya lo muestra cargarBorradores */ }
}

async function cargarBorradores(){
  const estado = document.getElementById('estado-conexion');
  try{
    const data = await api('GET', '/instagram/borradores');
    borradores = data.borradores || [];
    estado.textContent = 'Conectado';
    estado.style.color = 'var(--mint-dark)';
  }catch(e){
    borradores = [];
    estado.textContent = e.message;
    estado.style.color = 'var(--coral-dark)';
    document.getElementById('config').open = true;
  }
  render();
}

function cambiarTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === el));
  estadoActual = el.dataset.estado;
  render();
}

function fecha(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hourCycle: 'h23', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function render(){
  document.querySelectorAll('.tab').forEach(t => {
    const n = borradores.filter(b => b.estado === t.dataset.estado).length;
    const c = t.querySelector('.count');
    if(c) c.textContent = n ? `(${n})` : '';
  });
  if(estadoActual === 'calendario'){ renderCalendario(); return; }
  const lista = borradores.filter(b => b.estado === estadoActual);
  // Los aprobados, en el orden en que se van a publicar
  if(estadoActual === 'aprobado') lista.sort((a, b) => (a.programado_para ? new Date(a.programado_para) : Infinity) - (b.programado_para ? new Date(b.programado_para) : Infinity));
  const cont = document.getElementById('lista');
  if(!lista.length){
    const textos = { borrador: 'No hay borradores. Generá uno nuevo arriba.', aprobado: 'No hay publicaciones aprobadas esperando.', publicado: 'Todavía no se publicó nada desde acá.' };
    cont.innerHTML = `<div class="card vacio"><p class="muted">${textos[estadoActual]}</p></div>`;
    return;
  }
  cont.innerHTML = lista.map(tarjeta).join('');
  // El chat arranca mostrando lo último que se habló
  cont.querySelectorAll('.chat-hist').forEach(h => { h.scrollTop = h.scrollHeight; });
}

function tarjeta(b){
  const c = b.contenido || {};
  const slides = (b.slides || []).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Slide ${i + 1}" loading="lazy"></a>`).join('');
  const habs = (c.habilidades || []).map(h => `<span class="chip">${esc(h.nombre)}</span>`).join('');
  const editable = b.estado !== 'publicado';
  let acciones = '';
  if(b.estado === 'borrador'){
    acciones = `
      <button class="btn btn-soft" onclick="guardarCaption('${b.id}')">Guardar texto</button>
      <button class="btn btn-good" onclick="cambiarEstado('${b.id}','aprobado')">Aprobar</button>
      <button class="btn btn-danger" onclick="descartar('${b.id}')">Descartar</button>`;
  } else if(b.estado === 'aprobado'){
    acciones = `
      <button class="btn btn-soft" onclick="guardarCaption('${b.id}')">Guardar texto</button>
      <button class="btn btn-soft" onclick="cambiarEstado('${b.id}','borrador')">Volver a borrador</button>
      ${agendaInfo.ig_conectado ? `<button class="btn btn-primary" onclick="publicar('${b.id}', this)">Publicar ahora</button>` : ''}`;
  }
  const fechaPub = editable
    ? `<div class="fecha-pub">📅 Publicar el <select onchange="cambiarFecha('${b.id}', this)">${opcionesFecha(b)}</select></div>`
    : '';
  const meta = b.estado === 'publicado' ? `Publicado ${fecha(b.publicado_at)}` : `Generado ${fecha(b.created_at)}`;
  return `
    <div class="card" id="b-${b.id}">
      <div class="borrador-head">
        <div>
          <h3>${esc(c.nombre || 'Publicación')}</h3>
          <div class="meta">${esc(meta)}${c.edad ? ' · ' + esc(c.edad) : ''}${b.tema ? ' · estilo ' + esc(b.tema) : ''}</div>
          ${habs ? `<div class="chips">${habs}</div>` : ''}
        </div>
        <div class="head-right"><span class="pill ${esc(b.estado)}">${esc(b.estado)}</span></div>
      </div>
      ${fechaPub}
      <div class="slides">${slides}</div>
      <div class="section-label">Texto del posteo</div>
      <textarea id="cap-${b.id}" ${editable ? '' : 'readonly'}>${esc(b.caption)}</textarea>
      ${b.error ? `<div class="error-box">Último error al publicar: ${esc(b.error)}</div>` : ''}
      ${acciones ? `<div class="acciones">${acciones}</div>` : ''}
      ${b.estado === 'aprobado' && !agendaInfo.ig_conectado ? bloqueManual(b) : ''}
      ${editable ? chat(b) : ''}
    </div>`;
}

function chat(b){
  const c = b.contenido || {};
  const hist = (c.historial || []).map(h => `<div class="msg yo">${esc(h.mensaje)}</div><div class="msg ia">${esc(h.respuesta)}</div>`).join('');
  const puedeDeshacer = (c.versiones || []).length > 0;
  return `
    <div class="chat">
      <div class="section-label">Charlá con Claude para ajustarla</div>
      ${hist ? `<div class="chat-hist" id="hist-${b.id}">${hist}</div>` : ''}
      <form class="chat-form" onsubmit="editar(event,'${b.id}')">
        <textarea id="msg-${b.id}" placeholder="Ej: hacé el título más grande y poné el logo arriba a la izquierda" maxlength="1000" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit();}"></textarea>
        <button class="btn btn-primary" type="submit" id="send-${b.id}">Enviar</button>
      </form>
      <div class="trabajando"><span class="spinner oscuro"></span> Claude está trabajando… puede tardar hasta un minuto.</div>
      ${hist ? '' : '<p class="chat-ejemplos">Pedile lo que quieras, como a una persona: cambiar textos, tamaños, colores, mover el logo, otra foto, agregar o sacar una slide, o preguntale qué le mejorarías.</p>'}
      <div class="chat-extra">
        ${puedeDeshacer ? `<button class="btn btn-soft" onclick="deshacer('${b.id}')">↶ Deshacer último cambio</button>` : ''}
        <button class="btn btn-soft" onclick="guardarPlantilla('${b.id}', this)">Guardar diseño como plantilla</button>
      </div>
    </div>`;
}

async function editar(ev, id){
  ev.preventDefault();
  const input = document.getElementById('msg-' + id);
  const mensaje = input.value.trim();
  if(!mensaje) return;
  const card = document.getElementById('b-' + id);
  const btn = document.getElementById('send-' + id);
  card.classList.add('procesando');
  input.disabled = true; btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  // Mostramos el mensaje enseguida, sin esperar la respuesta
  let hist = document.getElementById('hist-' + id);
  if(!hist){
    hist = document.createElement('div');
    hist.className = 'chat-hist'; hist.id = 'hist-' + id;
    card.querySelector('.chat-form').before(hist);
  }
  hist.insertAdjacentHTML('beforeend', `<div class="msg yo">${esc(mensaje)}</div>`);
  hist.scrollTop = hist.scrollHeight;
  try{
    await api('POST', `/instagram/borradores/${id}/editar`, { mensaje });
    await cargarBorradores();
    // Si estaba aprobado vuelve a borradores: seguimos mostrándolo donde quedó
    if(estadoActual !== 'borrador') cambiarTab(document.querySelector('.tab[data-estado="borrador"]'));
    const h = document.getElementById('hist-' + id);
    if(h) h.scrollTop = h.scrollHeight;
    document.getElementById('msg-' + id)?.focus();
  }catch(e){
    toast(e.message);
    card.classList.remove('procesando');
    input.disabled = false; btn.disabled = false; btn.textContent = 'Enviar';
    input.value = mensaje;
  }
}

async function deshacer(id){
  try{
    await api('POST', `/instagram/borradores/${id}/deshacer`);
    toast('Volvió a la versión anterior');
    await cargarBorradores();
  }catch(e){ toast(e.message); }
}

async function guardarPlantilla(id, btn){
  const nombre = prompt('¿Qué nombre le ponemos a esta plantilla?');
  if(!nombre || !nombre.trim()) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner oscuro"></span> Guardando…';
  try{
    await api('POST', `/instagram/borradores/${id}/guardar-plantilla`, { nombre: nombre.trim() });
    toast('Plantilla guardada: la vas a encontrar en "Estilo"');
    await cargarPlantillas();
  }catch(e){ toast(e.message); }
  btn.disabled = false; btn.textContent = 'Guardar diseño como plantilla';
}

async function cargarPlantillas(){
  try{
    const { plantillas } = await api('GET', '/instagram/plantillas');
    misPlantillas = plantillas;
    document.getElementById('gen-plantillas').innerHTML = plantillas.map(p => `<option value="plantilla:${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
    document.getElementById('mis-plantillas').innerHTML = plantillas.length
      ? '<span class="muted">Mis plantillas:</span>' + plantillas.map(p => `<span class="chip">${esc(p.nombre)}<button title="Borrar plantilla" onclick="borrarPlantilla('${esc(p.id)}')">✕</button></span>`).join('')
      : '';
  }catch(e){ /* sin conexión: lo muestra cargarBorradores */ }
}

let misPlantillas = [];

async function borrarPlantilla(id){
  const nombre = misPlantillas.find(p => p.id === id)?.nombre || '';
  if(!confirm(`¿Borrar la plantilla "${nombre}"?`)) return;
  try{
    await api('DELETE', `/instagram/plantillas/${id}`);
    toast('Plantilla borrada');
    await cargarPlantillas();
  }catch(e){ toast(e.message); }
}

// --- Agenda y calendario ---

let agendaInfo = { agenda: null, ig_conectado: false, proximos: [] };
// Siempre en hora de Argentina, aunque el navegador esté en otra zona
const ZONA = { timeZone: 'America/Argentina/Buenos_Aires', hourCycle: 'h23' };
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

async function cargarAgenda(){
  try{ agendaInfo = await api('GET', '/instagram/agenda'); }catch(e){ /* lo muestra la conexión */ }
}

function fechaLarga(iso){
  return new Date(iso).toLocaleString('es-AR', { ...ZONA, weekday:'long', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' });
}

function claveDia(d){ return new Date(d).toLocaleDateString('es-AR', ZONA); }

// Opciones de fecha: próximos horarios libres de la agenda + la fecha actual del borrador
function opcionesFecha(b){
  const ocupadas = new Set(borradores.filter(x => x.id !== b.id && x.programado_para).map(x => new Date(x.programado_para).getTime()));
  const libres = agendaInfo.proximos.filter(f => !ocupadas.has(new Date(f).getTime()));
  const actual = b.programado_para ? new Date(b.programado_para).toISOString() : '';
  const lista = [...new Set([...(actual ? [actual] : []), ...libres])].sort();
  return `<option value="">Sin fecha</option>` +
    lista.map(f => `<option value="${f}" ${f === actual ? 'selected' : ''}>${esc(fechaLarga(f))}</option>`).join('') +
    `<option value="otra">Otra fecha…</option>`;
}

async function cambiarFecha(id, sel){
  let valor = sel.value;
  if(valor === 'otra'){
    const txt = prompt('¿Cuándo? Escribilo así: 2026-10-03 18:30');
    if(!txt){ render(); return; }
    const d = new Date(txt.trim().replace(' ', 'T') + ':00-03:00');
    if(isNaN(d)){ toast('No entendí la fecha'); render(); return; }
    valor = d.toISOString();
  }
  try{
    await api('PATCH', `/instagram/borradores/${id}`, { programado_para: valor || null });
    toast(valor ? 'Fecha guardada' : 'Quedó sin fecha');
    await cargarBorradores();
  }catch(e){ toast(e.message); }
}

// Mientras Instagram no esté conectado: compartir / descargar / copiar y marcar como publicado
function bloqueManual(b){
  const vence = b.programado_para && new Date(b.programado_para) <= new Date(Date.now() + 3 * 3600e3);
  return `
    <div class="manual ${vence ? 'hoy' : ''}">
      <div class="manual-tit">${vence ? '¡Es hora de publicarlo!' : 'Para publicarlo desde el celular'}</div>
      <div class="acciones">
        <button class="btn btn-primary" onclick="compartir('${b.id}', this)">Compartir en Instagram</button>
        <button class="btn btn-soft" onclick="descargar('${b.id}', this)">Descargar imágenes</button>
        <button class="btn btn-soft" onclick="copiarTexto('${b.id}')">Copiar texto</button>
        <button class="btn btn-good" onclick="marcarPublicado('${b.id}')">Ya lo publiqué</button>
      </div>
    </div>`;
}

async function archivosDe(b){
  return Promise.all(b.slides.map(async (u, i) => {
    const r = await fetch(u);
    if(!r.ok) throw new Error('No se pudo bajar la imagen ' + (i + 1));
    return new File([await r.blob()], `crear-y-jugar-${i + 1}.jpg`, { type: 'image/jpeg' });
  }));
}

async function copiarTexto(id){
  const b = borradores.find(x => x.id === id);
  try{ await navigator.clipboard.writeText(document.getElementById('cap-' + id)?.value || b.caption || ''); toast('Texto copiado: pegalo en Instagram'); }
  catch(e){ toast('No se pudo copiar; seleccioná el texto y copialo a mano'); }
}

async function compartir(id, btn){
  const b = borradores.find(x => x.id === id);
  btn.disabled = true;
  try{
    // Instagram no toma el texto al compartir: lo dejamos copiado para pegarlo
    await copiarTexto(id);
    const files = await archivosDe(b);
    if(navigator.canShare && navigator.canShare({ files })){
      await navigator.share({ files });
    }else{
      toast('Este dispositivo no permite compartir directo: descargá las imágenes');
    }
  }catch(e){ if(e.name !== 'AbortError') toast(e.message); }
  btn.disabled = false;
}

async function descargar(id, btn){
  const b = borradores.find(x => x.id === id);
  btn.disabled = true;
  try{
    const files = await archivosDe(b);
    for(const f of files){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 300));
    }
    toast('Imágenes descargadas');
  }catch(e){ toast(e.message); }
  btn.disabled = false;
}

async function marcarPublicado(id){
  if(!confirm('¿Ya lo subiste a Instagram? Se va a mover a "Publicados".')) return;
  try{
    await api('POST', `/instagram/borradores/${id}/marcar-publicado`);
    toast('¡Listo! Quedó en Publicados');
    await Promise.all([cargarBorradores(), cargarCandidatos()]);
  }catch(e){ toast(e.message); }
}

// Vista de calendario: próximos 14 días con los horarios de la agenda y lo asignado a cada uno
function renderCalendario(){
  const cont = document.getElementById('lista');
  const a = agendaInfo.agenda;
  if(!a){ cont.innerHTML = '<div class="card vacio"><p class="muted">No se pudo cargar la agenda.</p></div>'; return; }
  const programados = borradores.filter(b => b.programado_para && b.estado !== 'publicado' || (b.estado === 'publicado' && b.programado_para && new Date(b.programado_para) > Date.now() - 86400e3));
  const items = [];
  const usados = new Set();
  for(const f of agendaInfo.proximos){
    const b = programados.find(x => new Date(x.programado_para).getTime() === new Date(f).getTime());
    if(b) usados.add(b.id);
    items.push({ fecha: f, b });
  }
  for(const b of programados) if(!usados.has(b.id)) items.push({ fecha: b.programado_para, b });
  items.sort((x, y) => new Date(x.fecha) - new Date(y.fecha));

  const porDia = {};
  for(const it of items){ (porDia[claveDia(it.fecha)] ||= []).push(it); }
  const resumen = a.slots.map(s => `${DIAS[s.dia].toLowerCase()} ${s.hora}`).join(', ');
  const dias = Object.values(porDia).map(lista => `
    <div class="cal-dia">
      <div class="cal-fecha">${esc(new Date(lista[0].fecha).toLocaleDateString('es-AR', { ...ZONA, weekday:'long', day:'numeric', month:'long' }))}</div>
      ${lista.map(({ fecha: f, b }) => `
        <div class="cal-item">
          <div class="cal-hora">${esc(new Date(f).toLocaleTimeString('es-AR', { ...ZONA, hour:'2-digit', minute:'2-digit' }))}</div>
          ${b ? `
            <img src="${esc(b.slides?.[0] || '')}" alt="">
            <div class="cal-info"><b>${esc(b.contenido?.nombre || 'Publicación')}</b><span class="pill ${esc(b.estado)}">${esc(b.estado)}</span></div>
            <button class="btn btn-soft" onclick="verBorrador('${b.id}','${b.estado}')">Ver</button>`
          : `
            <div class="cal-info muted">Libre</div>
            <button class="btn btn-soft" onclick="generarPara('${f}', this)">Generar</button>`}
        </div>`).join('')}
    </div>`).join('');

  cont.innerHTML = `
    <div class="card">
      <div class="section-label">Agenda</div>
      <p class="muted">Publica: <b>${esc(resumen)}</b>. ${a.auto ? `Los ${esc(DIAS[a.generacion.dia].toLowerCase())} a las ${esc(a.generacion.hora)} arma solo los borradores de la semana.` : 'La generación automática está apagada.'}
      ${agendaInfo.ig_conectado ? 'Los aprobados se publican solos a su hora.' : 'Instagram todavía no está conectado: a la hora indicada, publicalo desde el celular con los botones del borrador.'}</p>
      <div class="acciones">
        <button class="btn btn-primary" onclick="generarSemana(this)">Generar los que faltan de esta semana</button>
        <button class="btn btn-soft" onclick="editarAgenda()">Cambiar días y horarios</button>
      </div>
      <div id="editor-agenda"></div>
    </div>
    ${dias || '<div class="card vacio"><p class="muted">No hay nada en los próximos días.</p></div>'}`;
}

function verBorrador(id, estado){
  cambiarTab(document.querySelector(`.tab[data-estado="${estado}"]`));
  document.getElementById('b-' + id)?.scrollIntoView({ behavior: 'smooth' });
}

async function generarPara(fechaIso, btn){
  btn.disabled = true; btn.innerHTML = '<span class="spinner oscuro"></span>';
  try{
    await api('POST', '/instagram/generar', { programado_para: fechaIso });
    toast('Borrador listo para esa fecha');
    await Promise.all([cargarBorradores(), cargarCandidatos()]);
  }catch(e){ toast(e.message); btn.disabled = false; btn.textContent = 'Generar'; }
}

async function generarSemana(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generando… (unos segundos por publicación)';
  try{
    const r = await api('POST', '/instagram/agenda/generar-semana');
    toast(r.creados.length ? `Listo: ${r.creados.length} borrador(es) nuevo(s)` : 'La semana ya estaba completa');
    await Promise.all([cargarBorradores(), cargarCandidatos()]);
  }catch(e){ toast(e.message); btn.disabled = false; btn.textContent = 'Generar los que faltan de esta semana'; }
}

function editarAgenda(){
  const a = agendaInfo.agenda;
  const hora = (d) => a.slots.find(s => s.dia === d)?.hora || '';
  document.getElementById('editor-agenda').innerHTML = `
    <div class="editor-agenda">
      ${[1,2,3,4,5,6,7].map(d => `
        <label class="dia-row"><input type="checkbox" id="ag-on-${d}" ${hora(d) ? 'checked' : ''}> ${DIAS[d]}
          <input type="time" id="ag-h-${d}" value="${hora(d) || '21:00'}"></label>`).join('')}
      <label class="dia-row"><input type="checkbox" id="ag-auto" ${a.auto ? 'checked' : ''}> Armar solos los borradores los
        <select id="ag-gen-dia">${[1,2,3,4,5,6,7].map(d => `<option value="${d}" ${d === a.generacion.dia ? 'selected' : ''}>${DIAS[d].toLowerCase()}</option>`).join('')}</select>
        a las <input type="time" id="ag-gen-h" value="${a.generacion.hora}"></label>
      <div class="acciones"><button class="btn btn-primary" onclick="guardarAgenda()">Guardar agenda</button></div>
    </div>`;
}

async function guardarAgenda(){
  const slots = [1,2,3,4,5,6,7].filter(d => document.getElementById('ag-on-' + d).checked).map(d => ({ dia: d, hora: document.getElementById('ag-h-' + d).value }));
  const body = {
    slots,
    generacion: { dia: Number(document.getElementById('ag-gen-dia').value), hora: document.getElementById('ag-gen-h').value },
    auto: document.getElementById('ag-auto').checked,
  };
  try{
    await api('PUT', '/instagram/agenda', body);
    toast('Agenda guardada');
    await cargarAgenda(); render();
  }catch(e){ toast(e.message); }
}

async function generar(){
  const btn = document.getElementById('btn-generar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generando…';
  try{
    const estilo = document.getElementById('gen-tema').value;
    const body = estilo.startsWith('plantilla:') ? { plantilla_id: estilo.slice(10) } : { tema: estilo };
    const prod = document.getElementById('gen-producto').value;
    if(prod) body.producto_id = prod;
    await api('POST', '/instagram/generar', body);
    toast('Borrador listo');
    cambiarTab(document.querySelector('.tab[data-estado="borrador"]'));
    await Promise.all([cargarBorradores(), cargarCandidatos()]);
  }catch(e){ toast(e.message); }
  finally{ btn.disabled = false; btn.textContent = 'Generar'; }
}

async function guardarCaption(id){
  try{
    await api('PATCH', `/instagram/borradores/${id}`, { caption: document.getElementById('cap-' + id).value });
    toast('Texto guardado');
    await cargarBorradores();
  }catch(e){ toast(e.message); }
}

async function cambiarEstado(id, estado){
  try{
    const b = borradores.find(x => x.id === id);
    const cambios = { estado, caption: document.getElementById('cap-' + id).value }; // guarda el texto por si se editó sin guardar
    let mensaje = estado === 'aprobado' ? 'Aprobado' : 'Volvió a borradores';
    if(estado === 'aprobado' && b && !b.programado_para){
      // Si no tiene fecha, le asignamos el próximo horario libre de la agenda
      const ocupadas = new Set(borradores.filter(x => x.programado_para).map(x => new Date(x.programado_para).getTime()));
      const libre = agendaInfo.proximos.find(f => !ocupadas.has(new Date(f).getTime()));
      if(libre){ cambios.programado_para = libre; mensaje = `Aprobado para el ${fechaLarga(libre)}`; }
    }
    await api('PATCH', `/instagram/borradores/${id}`, cambios);
    toast(mensaje);
    await cargarBorradores();
  }catch(e){ toast(e.message); }
}

async function descartar(id){
  if(!confirm('¿Descartar este borrador? Se borra y el producto vuelve a quedar disponible.')) return;
  try{
    await api('DELETE', `/instagram/borradores/${id}`);
    toast('Borrador descartado');
    await Promise.all([cargarBorradores(), cargarCandidatos()]);
  }catch(e){ toast(e.message); }
}

async function publicar(id, btn){
  if(!confirm('¿Publicar ahora en Instagram?')) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Publicando…';
  try{
    await api('POST', `/instagram/borradores/${id}/publicar`);
    toast('¡Publicado en Instagram!');
  }catch(e){ toast(e.message); }
  await cargarBorradores();
}

function iniciar(){
  document.getElementById('cfg-url').value = leer(BACKEND_KEY);
  document.getElementById('cfg-clave').value = leer(CLAVE_KEY);
  if(!leer(CLAVE_KEY)) document.getElementById('config').open = true;
  cargarAgenda().then(cargarBorradores);
  cargarCandidatos();
  cargarPlantillas();
}
iniciar();
</script>
